"$schema" = 'https://starship.rs/config-schema.json'

# A readable context line, followed by an uncluttered command line.
add_newline = false
format = "$username$hostname$directory$git_branch$git_status$git_state$nodejs$bun$python$rust$golang$java$kotlin$lua$swift$cmd_duration$jobs$line_break$character"
right_format = ""
continuation_prompt = "[∙](dimmed blue) "

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"
read_only = " ⊘"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "⎇ "
style = "cyan"
format = "[$symbol$branch]($style) "
truncation_length = 24
truncation_symbol = "…"

[git_status]
style = "yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = '×${count}'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↑${ahead_count}↓${behind_count}'
untracked = '?${count}'
stashed = '≡${count}'
modified = '~${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '−${count}'

[git_state]
style = "bold red"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[cmd_duration]
min_time = 3000
format = "[$duration](dimmed yellow) "

[jobs]
symbol = "↻ "
style = "dimmed cyan"
format = "[$symbol$number]($style) "

[username]
show_always = false
style_user = "dimmed cyan"
style_root = "bold red"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "dimmed cyan"
format = "[@$hostname]($style) "

[nodejs]
symbol = "node "
style = "dimmed green"
format = "[$symbol$version]($style) "

[bun]
symbol = "bun "
style = "dimmed green"
format = "[$symbol$version]($style) "

[python]
symbol = "py "
style = "dimmed green"
format = "[${symbol}${version}( $virtualenv)]($style) "

[rust]
symbol = "rs "
style = "dimmed green"
format = "[$symbol$version]($style) "

[golang]
symbol = "go "
style = "dimmed green"
format = "[$symbol$version]($style) "

[java]
symbol = "java "
style = "dimmed green"
format = "[$symbol$version]($style) "

[kotlin]
symbol = "kt "
style = "dimmed green"
format = "[$symbol$version]($style) "

[lua]
symbol = "lua "
style = "dimmed green"
format = "[$symbol$version]($style) "

[swift]
symbol = "swift "
style = "dimmed green"
format = "[$symbol$version]($style) "
